name: Redevelopment Nationwide Public Data Daily Sync

on:
  schedule:
    # 매일 한국 시간 새벽 4시 (UTC 19:00) 자동 실행
    - cron: '0 19 * * *'
  workflow_dispatch: # 관리자 수동 실행 트리거 지원

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Redevelopment Public Data Sync
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: npm run sync:redevelopment
